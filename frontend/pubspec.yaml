name: best_solo
description: BEST SOLO - E-commerce platform for Solo entrepreneurs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Backend - Supabase
  supabase_flutter: ^2.3.4

  # Networking
  dio: ^5.3.3

  # Local Storage
  shared_preferences: ^2.5.4

  # Image Handling
  cached_network_image: ^3.3.0
  cloudinary: ^1.1.0

  # Forms
  flutter_form_builder: any
  form_builder_validators: any

  # Navigation
  go_router: ^12.1.1

  # Dependency Injection
  get_it: ^7.6.4

  # Animations
  flutter_animate: ^4.3.0

  # Utilities
  intl: any
  uuid: ^4.2.1
  google_fonts: ^6.1.0
  monnify_payment_sdk: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/